# tests/maestro/env.yaml — Maestro WEB 测试变量清单（模板，不含任何口令/密钥）
#
# ★ .env.local 会被 run-local.sh 以 bash source 读入：必须是 shell 语法
#   `KEY="value"`，不是本文件展示的 YAML `KEY: "value"` 风格（2026-11-07 踩过：
#   照抄 YAML 形状写 .env.local，source 报 command not found）。本文件只作字段清单。
#
# ★ Maestro CLI 2.11.0 没有 --env-file，flow 里的 ${VAR} 也不读 shell 环境变量：
#   变量只能靠 `maestro test -e KEY=VALUE` 逐个传。真实取值由 run-local.sh 从
#   tests/maestro/.env.local（本地生成，已 gitignore）读出后注入。
#
# 用法：bash tests/maestro/run-local.sh            # 全量
#       bash tests/maestro/run-local.sh m1-magpie-providers   # 只跑一个 flow

# ── 被测实例（magpie 本地节点）────────────────────────────────────────
# magpie web 的带 key 首页（key 即 MAGPIE_WEB_KEY，16+ 字符）
MAGPIE_URL: "http://127.0.0.1:3446/?k=changeme-16chars-min"

# ── 网关（llm.itestu.cn 管理端）───────────────────────────────────────
GATEWAY_URL: "https://llm.itestu.cn"
# 自动注册的 provider id（/providers/:id 详情页路由参数）
GATEWAY_PROVIDER_ID: "0"
# provider 显示名里 @ 后面的主机名。flow 里的断言是全匹配 textRegex：
# 值会当正则编译，别带括号/方括号这类元字符（display_name 里的 (192.168.31.30)
# 用 .* 兜底）
GATEWAY_MAGPIE_HOST: "my-macbook.local"
# magpie 网关的 host:port（详情页 Base URL 断言用）
GATEWAY_MAGPIE_BASE: "192.168.31.x:3425"
# 管理端登录账号（真实口令放 .env.local；连续登录失败会触发验证码闸门，
# 那种状态下登录 flow 必然失败——先清失败计数再跑）
GATEWAY_ADMIN_USER: ""
GATEWAY_ADMIN_PASSWORD: ""
